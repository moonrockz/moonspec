$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://moonrockz.github.io/moonspec/schemas/moonspec.schema.json"
title: Moonspec Configuration
description: Configuration for the moonspec BDD test framework.
type: object
additionalProperties: false

properties:
  world:
    type: string
    description: >
      World type name used for test generation (e.g. "CalcWorld").
      Must match a MoonBit struct that implements the World trait.

  execution:
    default: "async"
    description: >
      Scalar async/sync preserves legacy generation. An object policy emits shared
      target packages. All four targets resolve explicitly; async wasm-gc is
      unsupported. Nearer config replaces the whole value. CLI --execution selects
      a scalar override while retaining shared factories when configured.
    oneOf:
      - type: string
        enum: ["async", "sync"]
      - type: object
        required: ["default"]
        additionalProperties: false
        properties:
          default:
            type: string
            enum: ["async", "sync"]
          targets:
            type: object
            additionalProperties: false
            properties:
              wasm:
                enum: ["async", "sync"]
              wasm-gc:
                const: "sync"
              js:
                enum: ["async", "sync"]
              native:
                enum: ["async", "sync"]
        allOf:
          - if:
              properties:
                default:
                  const: "async"
            then:
              required: ["targets"]
              properties:
                targets:
                  required: ["wasm-gc"]

  shared:
    type: object
    required: ["package", "world_factory", "options_factory"]
    additionalProperties: false
    description: >
      Portable definitions package exposing a public World implementation and world
      factory, plus options_factory(Array[FeatureSource]) returning fresh RunOptions
      and sinks on each call. Shared packages always use public visibility.
    properties:
      package:
        type: string
        pattern: "^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$"
      world_factory:
        $ref: "#/$defs/factoryIdentifier"
      options_factory:
        $ref: "#/$defs/factoryIdentifier"

  test_kind:
    type: string
    enum: ["wbtest", "test"]
    default: "wbtest"
    description: >
      Kind of test file that `moonspec gen tests` and `gen build` write.
      "wbtest": white-box *_wbtest.mbt files, which can use private items
      such as the World impl from `gen steps`. "test": black-box *_test.mbt
      files, which see only the public API.

  no_color:
    type: boolean
    default: false
    description: >
      Generate tests that print the failure report and pretty output without
      ANSI colors.

  mode:
    description: >
      Codegen mode for feature-to-test generation. Either a single mode
      applied to all features, or a map of feature file paths/globs to modes.
    oneOf:
      - type: string
        enum: ["per-scenario", "per-feature"]
        description: Apply this mode to all feature files.
      - type: object
        description: >
          Map of feature file paths or glob patterns to modes.
          Use "*" as the fallback default. More specific paths take precedence.
        additionalProperties:
          type: string
          enum: ["per-scenario", "per-feature"]
        examples:
          - {"features/checkout.feature": "per-feature", "*": "per-scenario"}

  skip_tags:
    type: array
    description: >
      Gherkin tags that cause scenarios to be skipped before execution.
      Each entry should include the @ prefix (e.g. "@skip", "@ignore").
      Scenarios tagged with any of these are reported as Skipped with
      the tag name or an optional reason extracted from the tag.
    default: ["@skip", "@ignore"]
    items:
      type: string
      pattern: "^@"
    examples: [["@skip", "@ignore", "@wip"]]

  formatters:
    type: array
    description: >
      Output formatters for test results. Each entry specifies a formatter
      type and output destination. If omitted, defaults to pretty on stdout.
    items:
      type: object
      required: ["type", "output"]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: ["pretty", "junit", "messages"]
          description: Formatter type.
        output:
          type: string
          description: >
            Output destination: "stdout", "stderr", or a file path.
          examples: ["stdout", "stderr", "reports/results.xml"]
        no_color:
          type: boolean
          description: Disable ANSI colors (pretty formatter only).
          default: false
    examples:
      - [{"type": "pretty", "output": "stdout"}, {"type": "junit", "output": "reports/results.xml"}]

  steps:
    type: object
    description: Configuration for `moonspec gen steps` attribute scanning.
    additionalProperties: false
    properties:
      output:
        type: string
        description: >
          Where to write the generated configure impl.
          Built-in modes: "alongside" (default; <world>_steps_gen.mbt next to
          the step functions), "per-package" (moonspec_gen.mbt per package),
          "generated" (_generated/ at the module root; does not compile,
          because the impl must be in the World type's package).
          Any other value is treated as a custom output directory path in the
          World type's package.
        default: "alongside"
        examples: ["alongside", "per-package", "my_gen/"]
      exclude:
        type: array
        description: >
          Glob patterns for files/directories to skip when scanning
          for #moonspec.* attributes.
        items:
          type: string
        examples: [["lib/*", "vendor/*"]]

allOf:
  - if:
      required: ["execution"]
      properties:
        execution:
          type: object
    then:
      required: ["shared"]

$defs:
  factoryIdentifier:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    not:
      enum: ["_", "abstract", "alias", "and", "as", "assert", "async", "await", "break", "catch", "const", "continue", "declare", "defer", "derive", "do", "dyn", "else", "enum", "enumview", "errdefer", "extend", "extenum", "extern", "false", "final", "fn", "for", "guard", "if", "impl", "import", "in", "is", "let", "letrec", "lexmatch", "lexscan", "local", "loop", "macro", "match", "method", "module", "move", "mut", "nobreak", "nocancel", "noraise", "override", "package", "priv", "proof_assert", "proof_let", "pub", "raise", "readonly", "ref", "return", "static", "struct", "suberror", "super", "test", "throw", "trait", "true", "try", "type", "typeof", "unsafe", "use", "using", "var", "virtual", "where", "while", "with", "yield"]
