name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "mise-tasks/site/**"
      - ".github/workflows/pages.yml"
    # The release workflow publishes with GITHUB_TOKEN, which does not fire
    # `release: published`; the tag push does the redeploy. Path filters do
    # not apply to tag pushes.
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: |
          moon update
          moon install moonbit-community/warren@0.4.5

      - name: Check out the latest release
        id: release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git worktree add ../release "$tag"

      - name: Build the release docs
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >
          mise run site:build -- --content ../release --channel release
          --site-root /moonspec/ --release-version "$RELEASE_TAG"
          --ref "$RELEASE_TAG" --out _site

      - name: Build the main docs
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mise run site:build -- --content . --channel next \
            --site-root /moonspec/ --release-version "$RELEASE_TAG" \
            --ref "$(git rev-parse HEAD)" --out _site/next

      - name: Check links
        run: |
          mise run site:linkcheck -- --dist _site --base /moonspec/ --ignore /moonspec/next/
          mise run site:linkcheck -- --dist _site/next --base /moonspec/next/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
