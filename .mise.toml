[tools]
node = "24.14.1"
"npm:@fission-ai/openspec" = "1.14.3"
"aqua:orhun/git-cliff" = "2.14.2"
lefthook = "2.1.1"

# Match the compiler and core version used by GitHub Actions. Local commands must
# not fall back to a newer global MoonBit installation. This block has the same
# form as finos/morphir-moonbit main (.config/mise/config.toml), including its
# Windows postinstall. The 1.0.0-rc1 version, URLs and tools/moonbit-core-pin.json
# digests come from the MoonBit release itself. To move to a newer release, change
# the version here and in each URL (with "+" written as "%2B"), and update
# tools/moonbit-core-pin.json for the same release.
[tools."http:moonbit"]
version = "1.0.0-rc1+3c0520448"
bin_path = "bin"
# The archive alone has no core or moonx. Complete Unix installs the same way
# locally and in CI, using the upstream installer and the exact mise version.
# The upstream Unix installer supports Linux x64/ARM64 and Apple Silicon.
# The "-" markers remove the newlines around each command. Windows runs the hook
# with `cmd /s /c`, which stops at the first newline: a leading newline runs nothing.
postinstall = """
{%- if os() != "windows" -%}
bash -c 'set -euo pipefail; export PATH="$MISE_TOOL_INSTALL_PATH/bin:$PATH"; curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME="$MISE_TOOL_INSTALL_PATH" bash -s -- "$MISE_TOOL_VERSION"'
{%- else -%}
pwsh -NoProfile -File "{{config_root}}/tools/bootstrap-moonbit-windows.ps1"
{%- endif -%}
"""

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/1.0.0-rc1%2B3c0520448/moonbit-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/1.0.0-rc1%2B3c0520448/moonbit-linux-aarch64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/1.0.0-rc1%2B3c0520448/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/1.0.0-rc1%2B3c0520448/moonbit-windows-x86_64.zip", format = "zip" }
# No Windows arm64 build is published; Windows on Arm runs the x64 build under emulation.
windows-arm64 = { url = "https://cli.moonbitlang.com/binaries/1.0.0-rc1%2B3c0520448/moonbit-windows-x86_64.zip", format = "zip" }
